name: Desktop Trial
on:
  workflow_dispatch:
  push:
    branches: [feat/13-encrypted-sync-release, feat/15-refined-typography]
    paths: ['desktop/**', 'src/**', 'scripts/**', 'public/**', 'build/**', 'package*.json', 'tsconfig*.json', 'vite.config.ts', '.github/workflows/desktop.yml', 'THIRD_PARTY*']
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            pack: npm run desktop:pack
            executable: release/win-unpacked/观策AI.exe
          - os: macos-14
            platform: macos-arm64
            pack: node scripts/package-macos.mjs arm64
            executable: release/installed-arm64/观策AI.app/Contents/MacOS/观策AI
          - os: macos-15-intel
            platform: macos-x64
            pack: node scripts/package-macos.mjs x64
            executable: release/installed-x64/观策AI.app/Contents/MacOS/观策AI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:desktop
      - run: npm test
      - run: npm run desktop:build
      - run: npm run desktop:test
      - run: node scripts/desktop-sync-verify.mjs
      - run: node scripts/desktop-visual.mjs
      - name: Long text layout regression
        run: node scripts/desktop-visual.mjs
        env:
          GUANCE_LONG_TEXT: '1'
      - run: ${{ matrix.pack }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged app
        run: npm run desktop:test
        env:
          GUANCE_EXECUTABLE: ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            docs/desktop/
            docs/desktop-visual/
            docs/desktop-long-text/
          retention-days: 14
