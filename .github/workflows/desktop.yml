name: Desktop Trial
on:
  workflow_dispatch:
  push:
    branches: [feat/13-encrypted-sync-release]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            pack: npm run desktop:pack
            executable: release/win-unpacked/观策AI.exe
          - os: macos-14
            platform: macos-arm64
            pack: npm run desktop:pack -- --mac --arm64
            executable: release/mac-arm64/观策AI.app/Contents/MacOS/观策AI
          - os: macos-15-intel
            platform: macos-x64
            pack: npm run desktop:pack -- --mac --x64
            executable: release/mac/观策AI.app/Contents/MacOS/观策AI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:desktop
      - run: npm test
      - run: npm run desktop:build
      - run: npm run desktop:test
      - run: node scripts/desktop-sync-verify.mjs
      - run: node scripts/desktop-visual.mjs
      - run: ${{ matrix.pack }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged app
        run: npm run desktop:test
        env:
          GUANCE_EXECUTABLE: ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            docs/desktop/
            docs/desktop-visual/
          retention-days: 14
