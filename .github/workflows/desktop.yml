name: Desktop Trial
on:
  workflow_dispatch:
  push:
    branches: [feat/13-encrypted-sync-release]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:desktop
      - run: npm test
      - run: npm run desktop:build
      - run: npm run desktop:test
      - run: node scripts/desktop-sync-verify.mjs
      - run: node scripts/desktop-visual.mjs
      - run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            docs/desktop/
            docs/desktop-visual/
          retention-days: 14
