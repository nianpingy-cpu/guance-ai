name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: npm run preview -- --host 127.0.0.1 --port 5174 &
      - run: npm run ui:verify
      - run: node scripts/typography-verify.mjs
      - run: npm run ui:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: |
            docs/ui-verification.json
            docs/screenshots/desktop-*.png
            docs/screenshots/tablet-*.png
            docs/screenshots/mobile-*.png
            docs/typography/results.json
            docs/typography/after-*.png
            docs/visual/results.json
          retention-days: 7
